<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Lost Passage: DEOWAN Void Runner (Standalone Single-File Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #050811; color: #f1f5f9;
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px; background: #0d1424; border-bottom: 1px solid #1e293b;
      flex-shrink: 0; gap: 8px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 14px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    .brand-sub { font-size: 11px; color: #94a3b8; }
    .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .t-btn {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .t-btn:hover { background: #334155; color: #fff; }
    .t-btn.active-sim { background: #059669; color: #fff; border-color: #34d399; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
    .t-btn.active-cyan { background: #083344; color: #67e8f9; border-color: #06b6d4; }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; padding: 6px; overflow: hidden;
    }
    .canvas-wrap {
      position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9;
      max-height: 100%; border-radius: 10px; overflow: hidden;
      border: 1px solid #1e293b; box-shadow: 0 0 40px rgba(0,0,0,0.85); background: #000;
    }
    canvas {
      width: 100%; height: 100%; object-fit: contain; display: block;
      cursor: crosshair; outline: none; touch-action: none;
    }
    .touch-overlay {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 20;
    }
    .dpad, .actions { display: flex; gap: 6px; pointer-events: auto; }
    .dpad { flex-direction: column; align-items: center; }
    .dpad-row { display: flex; gap: 6px; }
    .c-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4); background: rgba(15,23,42,0.75);
      color: #fff; font-size: 10px; font-weight: 700; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: none; backdrop-filter: blur(4px);
    }
    .c-btn:active { transform: scale(0.92); background: rgba(56,189,248,0.6); }
    .c-flare { background: rgba(225,29,72,0.8); border-color: #fda4af; }
    .c-boost { background: rgba(217,119,6,0.8); border-color: #fcd34d; }
    .c-shield { background: rgba(8,145,178,0.8); border-color: #67e8f9; }
    .c-heal { background: rgba(5,150,105,0.8); border-color: #6ee7b7; }
    @media (min-width: 900px) and (pointer: fine) {
      .touch-overlay { opacity: 0.25; transition: opacity 0.2s; }
      .touch-overlay:hover { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <div class="brand-title">THE LOST PASSAGE: DEOWAN VOID RUNNER</div>
        <div class="brand-sub">Single-File Portable Edition • By Evan Nirjon & Tasnim Islam</div>
      </div>
    </div>
    <div class="toolbar">
      <button id="btn-sim" class="t-btn">🎮 SIMULATE GAME</button>
      <button id="btn-bgm" class="t-btn active-cyan">🎵 BGM: ON</button>
      <button id="btn-sfx" class="t-btn active-cyan">🔊 SFX: ON</button>
      <button id="btn-pause" class="t-btn">🚀 LAUNCH</button>
      <button id="btn-restart" class="t-btn">🔄 RESTART</button>
      <button id="btn-fs" class="t-btn">⛶ FULLSCREEN</button>
    </div>
  </header>
  <main>
    <div class="canvas-wrap">
      <canvas id="game-canvas" width="1280" height="720" tabindex="0"></canvas>
      <div class="touch-overlay">
        <div class="dpad">
          <button id="touch-up" class="c-btn">▲</button>
          <div class="dpad-row">
            <button id="touch-left" class="c-btn">◀</button>
            <button id="touch-down" class="c-btn">▼</button>
            <button id="touch-right" class="c-btn">▶</button>
          </div>
        </div>
        <div class="actions">
          <button id="touch-flare" class="c-btn c-flare">FLARE</button>
          <button id="touch-boost" class="c-btn c-boost">BOOST</button>
          <button id="touch-shield" class="c-btn c-shield">SHLD</button>
          <button id="touch-heal" class="c-btn c-heal">HEAL</button>
        </div>
      </div>
    </div>
  </main>
